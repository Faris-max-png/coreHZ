<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0d0619">
<title>zzCraft Launcher</title>
<style>
:root{font-family:Ubuntu,system-ui,sans-serif;color:#f9f6ef;background:#0d0619}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 20% 10%,rgba(123,31,162,.28),transparent 30%),linear-gradient(135deg,#1a0f2e,#0d0619);text-align:center}
.card{width:min(520px,90vw);padding:34px;border:1px solid rgba(255,255,255,.1);border-radius:24px;background:rgba(25,15,38,.86);box-shadow:0 20px 60px rgba(0,0,0,.4);backdrop-filter:blur(18px)}
h1{margin:0 0 8px;font-size:36px}p{color:#aaa;line-height:1.5}.spinner{width:38px;height:38px;margin:22px auto;border:3px solid rgba(255,255,255,.12);border-top-color:#38a7ff;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}button{border:0;border-radius:12px;padding:12px 20px;color:#fff;background:linear-gradient(135deg,#7b1fa2,#673ab7);font-weight:700;cursor:pointer}small{display:block;color:#777;margin-top:14px}
</style>
</head>
<body>
<main class="card">
<h1>zzCraft</h1>
<p id="msg">starting Minecraft launcher…</p>
<div class="spinner" aria-hidden="true"></div>
<button id="retry" hidden>launch again</button>
<small>coreHZ • Mineral launcher</small>
</main>
<script>
"use strict";
const target="https://dobberr.github.io/min/";
const msg=document.getElementById("msg"),retry=document.getElementById("retry");
let redirected=false;
function launch(){
  if(redirected)return;
  redirected=true;
  msg.textContent="opening zzCraft…";
  setTimeout(()=>{location.replace(target)},250);
}
retry.onclick=()=>{redirected=false;retry.hidden=true;launch()};
setTimeout(()=>{if(!document.hidden)launch()},3500);
window.addEventListener("error",()=>{redirected=false;msg.textContent="the launcher hit an error before opening.";retry.hidden=false});
launch();
</script>
</body>
</html>
